name: Deploy GlaucomaAI

# Triggers on every push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # set -e = stop the script immediately if any command fails
            # Without this, a failed "git pull" (e.g. local edits conflicting,
            # network issue, etc.) is silently ignored and the script carries on
            # to build and restart containers from STALE code - while GitHub
            # Actions still reports a green checkmark, hiding the real problem.
            # With set -e, that same failure stops the script here and the
            # workflow run shows red immediately, so it can't go unnoticed.
            set -e

            cd ~/glaucoma-detection

            echo "Pulling latest code from GitHub..."
            git pull origin main

            echo "Capturing commit hash for frontend build..."
            # Computed HERE, on EC2's real git checkout, where .git and the
            # git binary both genuinely exist - never inside the Docker
            # build context. Exported so docker-compose.yml's
            # ${VITE_COMMIT_HASH:-dev} substitution picks up this value
            # instead of falling back to "dev" in production.
            export VITE_COMMIT_HASH=$(git rev-parse --short HEAD)
            echo "Commit hash: $VITE_COMMIT_HASH"

            echo "Rebuilding backend, frontend, and report-service images..."
            # db is excluded - rebuilding it would risk disrupting the
            # running database and its data volume, which we never want
            # to do as part of a routine code deploy
            docker compose build --no-cache backend frontend report-service

            echo "Restarting backend, frontend, and report-service containers..."
            # --no-deps = do not restart db (data integrity - see above)
            docker compose up -d --no-deps backend frontend report-service

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Deploy finished successfully."