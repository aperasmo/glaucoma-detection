server {
    listen 80;
    server_name _;

    # Root directory where Vite builds the dist/ folder
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    # Reduces transfer size for JS, CSS, and JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Static asset caching
    # Vite fingerprints JS/CSS filenames on every build so 1 year cache is safe
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    # Required for React Router createBrowserRouter
    # Any path that does not match a real file falls back to index.html
    # Without this, refreshing any non-root route returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}